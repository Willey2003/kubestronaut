apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: platform-root
  namespace: kubestronaut
spec:
  exceptions:
    - policyName: require-secure-deployments
      ruleNames:
        - disallow-root-user
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
          namespaces:
            - kubestronaut
