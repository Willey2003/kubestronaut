apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: platform-root
  namespace: kubestronaut
spec:
  exceptions:
    - policyName: require-secure-deployments
      ruleNames:
        - disallow-root-user
        - autogen-disallow-root-user
        - require-resource-limits
        - autogen-require-resource-limits
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
          namespaces:
            - kubestronaut
