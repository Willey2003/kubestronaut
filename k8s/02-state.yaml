apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ga-state
  namespace: kubestronaut
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ga-registry
  namespace: kubestronaut
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
