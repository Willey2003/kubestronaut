apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: kubestronaut
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: borg
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              hostPort: 5101
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            limits: {memory: 512Mi, cpu: "0.5"}
            requests: {memory: 128Mi, cpu: "0.1"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ga-registry
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: kubestronaut
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
