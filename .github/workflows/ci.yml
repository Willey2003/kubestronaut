name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Byte-compile engine
        run: python -m compileall -q engine
      - name: Validate question banks
        run: python -m engine.validator
      - name: Shell lint (preflight)
        run: bash -n cluster/preflight.sh
