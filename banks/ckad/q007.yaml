kind: hands-on
domain: application-design-build
level: core
title: Persist Pod data with a PVC-backed volume
prompt: |
  Namespace `ckad-q07` does not exist yet — create it as part of this task.
  Create a PersistentVolumeClaim named `data-pvc` in namespace `ckad-q07` that
  requests 500Mi with access mode `ReadWriteOnce`. Then create a Pod named
  `storage` in the same namespace using image `busybox:1.36` that runs the
  command `sleep 3600` and mounts the claim at the path `/data`.
solution: |
  kubectl create namespace ckad-q07
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: data-pvc
    namespace: ckad-q07
  spec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 500Mi
  EOF
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: storage
    namespace: ckad-q07
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
          - name: data
            mountPath: /data
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc
  EOF
checks:
  - desc: PVC data-pvc exists in ckad-q07
    run: kubectl -n ckad-q07 get pvc data-pvc -o name
    equals: persistentvolumeclaim/data-pvc
  - desc: PVC requests 500Mi
    run: kubectl -n ckad-q07 get pvc data-pvc -o jsonpath='{.spec.resources.requests.storage}'
    equals: 500Mi
  - desc: PVC is bound
    run: kubectl -n ckad-q07 wait --for=jsonpath='{.status.phase}'=Bound pvc/data-pvc --timeout=60s
    exit-success: true
  - desc: Pod storage references the claim
    run: kubectl -n ckad-q07 get pod storage -o jsonpath='{.spec.volumes[0].persistentVolumeClaim.claimName}'
    equals: data-pvc
  - desc: Pod mounts the claim at /data
    run: kubectl -n ckad-q07 get pod storage -o jsonpath='{.spec.containers[0].volumeMounts[0].mountPath}'
    equals: /data
