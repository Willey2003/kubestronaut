kind: hands-on
domain: configuration-security
level: core
title: Mount a Secret as a volume
prompt: |
  Namespace `ckad-q13` does not exist yet — create it as part of this task.
  Create a Secret named `db-secret` in namespace `ckad-q13` with the key
  `password` set to `s3cr3t`. Then create a Pod named `db-client` in the same
  namespace using image `busybox:1.36` that runs `sleep 3600` and mounts the
  Secret as a volume at the path `/secrets`.
solution: |
  kubectl create namespace ckad-q13
  kubectl -n ckad-q13 create secret generic db-secret --from-literal=password=s3cr3t
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: db-client
    namespace: ckad-q13
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
          - name: creds
            mountPath: /secrets
    volumes:
      - name: creds
        secret:
          secretName: db-secret
  EOF
checks:
  - desc: Secret db-secret exists in ckad-q13
    run: kubectl -n ckad-q13 get secret db-secret -o name
    equals: secret/db-secret
  - desc: Secret stores the password key
    run: kubectl -n ckad-q13 get secret db-secret -o jsonpath='{.data.password}'
    non-empty: true
  - desc: Pod volume references the db-secret Secret
    run: kubectl -n ckad-q13 get pod db-client -o jsonpath='{.spec.volumes[0].secret.secretName}'
    equals: db-secret
  - desc: Pod mounts the Secret at /secrets
    run: kubectl -n ckad-q13 get pod db-client -o jsonpath='{.spec.containers[0].volumeMounts[0].mountPath}'
    equals: /secrets
