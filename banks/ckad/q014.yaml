kind: hands-on
domain: configuration-security
level: deep
title: Create an immutable Secret and inject it via envFrom
prompt: |
  Namespace `ckad-q14` does not exist yet — create it as part of this task.
  Create a Secret named `app-secret` in namespace `ckad-q14` with the key
  `token` set to `a1b2c3` and mark it `immutable: true`. Then create a Pod
  named `secured` in the same namespace using image `busybox:1.36` that runs
  `sleep 3600` and injects all keys of the Secret into its environment using
  `envFrom` with a `secretRef`.
solution: |
  kubectl create namespace ckad-q14
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Secret
  metadata:
    name: app-secret
    namespace: ckad-q14
  immutable: true
  stringData:
    token: a1b2c3
  EOF
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: secured
    namespace: ckad-q14
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        envFrom:
          - secretRef:
              name: app-secret
  EOF
checks:
  - desc: Secret app-secret exists in ckad-q14
    run: kubectl -n ckad-q14 get secret app-secret -o name
    equals: secret/app-secret
  - desc: Secret is immutable
    run: kubectl -n ckad-q14 get secret app-secret -o jsonpath='{.immutable}'
    equals: "true"
  - desc: Secret stores the token key
    run: kubectl -n ckad-q14 get secret app-secret -o jsonpath='{.data.token}'
    non-empty: true
  - desc: Pod injects all keys via envFrom
    run: kubectl -n ckad-q14 get pod secured -o jsonpath='{.spec.containers[0].envFrom[0].secretRef.name}'
    equals: app-secret
