kind: hands-on
domain: application-design-build
level: core
title: Build a multi-container Pod with init and sidecar
prompt: |
  Namespace `ckad-q06` does not exist yet — create it as part of this task.
  Create a Pod named `multi` in namespace `ckad-q06` with three containers
  that share an `emptyDir` volume mounted at `/shared`:

  - an init container named `seed` using image `busybox:1.36` that writes the
    string `ready` to the file `/shared/ready`;
  - a main container named `app` using image `nginx:stable-alpine`;
  - a sidecar container named `logger` using image `busybox:1.36` that runs
    the command `sleep 3600`.

  The init container must finish before the main container starts.
solution: |
  kubectl create namespace ckad-q06
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: multi
    namespace: ckad-q06
  spec:
    initContainers:
      - name: seed
        image: busybox:1.36
        command: ["sh", "-c", "echo ready > /shared/ready"]
        volumeMounts:
          - name: shared
            mountPath: /shared
    containers:
      - name: app
        image: nginx:stable-alpine
        volumeMounts:
          - name: shared
            mountPath: /shared
      - name: logger
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
          - name: shared
            mountPath: /shared
    volumes:
      - name: shared
        emptyDir: {}
  EOF
checks:
  - desc: Pod multi exists in ckad-q06
    run: kubectl -n ckad-q06 get pod multi -o name
    equals: pod/multi
  - desc: Init container is named seed
    run: kubectl -n ckad-q06 get pod multi -o jsonpath='{.spec.initContainers[0].name}'
    equals: seed
  - desc: Main container runs an nginx image
    run: kubectl -n ckad-q06 get pod multi -o jsonpath='{.spec.containers[0].image}'
    contains: nginx
  - desc: Sidecar container is named logger
    run: kubectl -n ckad-q06 get pod multi -o jsonpath='{.spec.containers[1].name}'
    equals: logger
  - desc: Shared volume is an emptyDir
    run: kubectl -n ckad-q06 get pod multi -o jsonpath='{.spec.volumes[0].name}'
    equals: shared
  - desc: Init container completed successfully
    run: kubectl -n ckad-q06 wait --for=jsonpath='{.status.phase}'=Running pod/multi --timeout=60s
    exit-success: true
