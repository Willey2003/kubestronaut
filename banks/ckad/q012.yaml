kind: hands-on
domain: configuration-security
level: core
title: Inject configuration with a ConfigMap env var
prompt: |
  Namespace `ckad-q12` does not exist yet — create it as part of this task.
  Create a ConfigMap named `app-config` in namespace `ckad-q12` with the data
  key `url` set to `https://api.example.com`. Then create a Pod named
  `configured` in the same namespace using image `busybox:1.36` that runs
  `sleep 3600` and exposes an environment variable `APP_URL` whose value comes
  from the `url` key of that ConfigMap via `configMapKeyRef`.
solution: |
  kubectl create namespace ckad-q12
  kubectl -n ckad-q12 create configmap app-config --from-literal=url=https://api.example.com
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: configured
    namespace: ckad-q12
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
          - name: APP_URL
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: url
  EOF
checks:
  - desc: ConfigMap app-config exists in ckad-q12
    run: kubectl -n ckad-q12 get configmap app-config -o name
    equals: configmap/app-config
  - desc: ConfigMap stores the url value
    run: kubectl -n ckad-q12 get configmap app-config -o jsonpath='{.data.url}'
    equals: https://api.example.com
  - desc: Pod defines the APP_URL environment variable
    run: kubectl -n ckad-q12 get pod configured -o jsonpath='{.spec.containers[0].env[0].name}'
    equals: APP_URL
  - desc: APP_URL references the app-config ConfigMap
    run: kubectl -n ckad-q12 get pod configured -o jsonpath='{.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}'
    equals: app-config
