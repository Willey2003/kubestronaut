kind: hands-on
domain: cluster-hardening
level: deep
title: Disable automatic ServiceAccount token mounting
prompt: |
  Namespace `lab-sa-token` exists. Create ServiceAccount `pipeline` in
  `lab-sa-token` with `automountServiceAccountToken: false`. Then create a
  Deployment `secure-app` in the same namespace that runs image `busybox:1.36`
  (container name `app`, command `sleep 3600`), references ServiceAccount
  `pipeline`, and disables automatic token mounting on the pod template.
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: pipeline
    namespace: lab-sa-token
  automountServiceAccountToken: false
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: secure-app
    namespace: lab-sa-token
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: secure-app
    template:
      metadata:
        labels:
          app: secure-app
      spec:
        serviceAccountName: pipeline
        automountServiceAccountToken: false
        containers:
          - name: app
            image: busybox:1.36
            command: ["sleep", "3600"]
  EOF
checks:
  - desc: ServiceAccount pipeline exists in lab-sa-token
    run: kubectl -n lab-sa-token get serviceaccount pipeline -o name
    equals: serviceaccount/pipeline
  - desc: ServiceAccount does not auto-mount tokens
    run: kubectl -n lab-sa-token get serviceaccount pipeline -o jsonpath='{.automountServiceAccountToken}'
    equals: "false"
  - desc: Deployment pod template does not auto-mount tokens
    run: kubectl -n lab-sa-token get deployment secure-app -o jsonpath='{.spec.template.spec.automountServiceAccountToken}'
    equals: "false"
  - desc: Deployment references the pipeline service account
    run: kubectl -n lab-sa-token get deployment secure-app -o jsonpath='{.spec.template.spec.serviceAccountName}'
    equals: pipeline
