kind: hands-on
domain: system-hardening
level: deep
title: Harden a container with drop capabilities, read-only root, non-root
prompt: |
  Namespace `lab-hardening` exists. Create Pod `locked-down` in `lab-hardening`
  running image `busybox:1.36` (container name `app`, command `sleep 3600`).
  The container must run as non-root user UID 1000, drop ALL Linux
  capabilities, mount a read-only root filesystem, and disable privilege
  escalation.
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: locked-down
    namespace: lab-hardening
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  EOF
checks:
  - desc: Pod locked-down exists in lab-hardening
    run: kubectl -n lab-hardening get pod locked-down -o name
    equals: pod/locked-down
  - desc: Container runs as non-root UID 1000
    run: kubectl -n lab-hardening get pod locked-down -o jsonpath='{.spec.containers[0].securityContext.runAsUser}'
    equals: "1000"
  - desc: Root filesystem is read-only
    run: kubectl -n lab-hardening get pod locked-down -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}'
    equals: "true"
  - desc: All Linux capabilities are dropped
    run: kubectl -n lab-hardening get pod locked-down -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop}'
    contains: ALL
