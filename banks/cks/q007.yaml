kind: hands-on
domain: system-hardening
level: core
title: Run a pod with RuntimeDefault seccomp and AppArmor profiles
prompt: |
  Namespace `lab-hardening` exists. Create Pod `seccomp-restricted` in
  `lab-hardening` running image `busybox:1.36` (container name `app`, command
  `sleep 3600`). The container must use the `RuntimeDefault` seccomp profile,
  the `RuntimeDefault` AppArmor profile, and must not be able to escalate
  privileges.
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: seccomp-restricted
    namespace: lab-hardening
  spec:
    containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
  EOF
checks:
  - desc: Pod seccomp-restricted exists in lab-hardening
    run: kubectl -n lab-hardening get pod seccomp-restricted -o name
    equals: pod/seccomp-restricted
  - desc: Container uses the RuntimeDefault seccomp profile
    run: kubectl -n lab-hardening get pod seccomp-restricted -o jsonpath='{.spec.containers[0].securityContext.seccompProfile.type}'
    equals: RuntimeDefault
  - desc: Container uses the RuntimeDefault AppArmor profile
    run: kubectl -n lab-hardening get pod seccomp-restricted -o jsonpath='{.spec.containers[0].securityContext.appArmorProfile.type}'
    equals: RuntimeDefault
  - desc: Privilege escalation is disabled
    run: kubectl -n lab-hardening get pod seccomp-restricted -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}'
    equals: "false"
