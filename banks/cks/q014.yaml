kind: hands-on
domain: supply-chain
level: core
title: Stop unnecessary image pulls with imagePullPolicy
prompt: |
  Namespace `lab-supply` exists. Create Deployment `supply-app` in `lab-supply`
  running image `busybox:1.36` (container name `app`, command `sleep 3600`).
  The image is immutable and cached on the nodes, so configure the deployment
  to avoid re-pulling it on every container start by explicitly setting
  `imagePullPolicy: IfNotPresent`.
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: supply-app
    namespace: lab-supply
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: supply-app
    template:
      metadata:
        labels:
          app: supply-app
      spec:
        containers:
          - name: app
            image: busybox:1.36
            command: ["sleep", "3600"]
            imagePullPolicy: IfNotPresent
  EOF
checks:
  - desc: Deployment supply-app exists in lab-supply
    run: kubectl -n lab-supply get deployment supply-app -o name
    equals: deployment.apps/supply-app
  - desc: imagePullPolicy avoids re-pulling the image
    run: kubectl -n lab-supply get deployment supply-app -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}'
    equals: IfNotPresent
  - desc: Deployment runs the expected image
    run: kubectl -n lab-supply get deployment supply-app -o jsonpath='{.spec.template.spec.containers[0].image}'
    equals: busybox:1.36
  - desc: Container is named app
    run: kubectl -n lab-supply get deployment supply-app -o jsonpath='{.spec.template.spec.containers[0].name}'
    equals: app
