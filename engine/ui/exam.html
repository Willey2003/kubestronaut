<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam - Golden Astronaut 2026</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="exam-header">
    <div>
      <span class="mode" id="mode"></span>
      <strong id="bank-title"></strong>
      <span class="timer" id="timer"></span>
    </div>
    <div class="actions">
      <button id="submit" class="btn primary">Submit</button>
      <a href="/" class="btn">Exit</a>
    </div>
  </header>

  <div class="exam-layout">
    <nav id="qlist" class="qlist"></nav>
    <main id="qpanel" class="qpanel"></main>
  </div>

  <div id="result" class="hidden">
    <h2 id="result-head"></h2>
    <p id="result-score"></p>
    <div id="result-domains"></div>
    <div id="result-detail"></div>
    <a href="/" class="btn primary">New attempt</a>
  </div>

  <script src="/static/exam.js"></script>
</body>
</html>
